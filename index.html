    <!-- Structured Data (JSON-LD) for FAQPage - Optimized for Generative AI Search Answers -->

          "@type": "Question",
          "name": "Aevum OS là gì?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Aevum OS là một Hệ điều hành Agent độc lập và Bộ não ngoại vi dành cho không gian làm việc phát triển AI. Nó quản lý bộ nhớ sống dài hạn, các bản kế hoạch hướng tên miền (DDD), và sự điều phối biệt đội đa agent tự trị mà không phụ thuộc vào trình soạn thảo."
          }
        },
        {
          "@type": "Question",
          "name": "Làm thế nào để kết nối Aevum OS với Cursor hoặc Claude Desktop?",

            "@type": "Answer",
            "text": "Bạn chỉ cần cài đặt và khởi chạy daemon Aevum OS thông qua dòng lệnh 'aevum --transport sse --port 3344', sau đó khai báo máy chủ MCP trong cấu hình của Cursor hoặc Claude Desktop trỏ về cổng kết nối tương ứng."
          }
        },
        {
          "@type": "Question",
          "name": "Nghi thức Bắt tay (Handshake Ritual) của Aevum OS là gì?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Đây là quy trình bắt tay bảo mật giữa Aevum OS Daemon và các Agent khách. Khi chạy, daemon phát ra một token tạm thời trong file .aevum/signal.json và Agent khách phải xác thực token này qua công cụ aevum_submit_ack để khởi động phiên làm việc."
          }
        },
        {
          "@type": "Question",
          "name": "Mạng lưới PiperNet (Internet of Agents) hoạt động ra sao?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "PiperNet là giao thức kết nối phi tập trung cho phép các Agent chia sẻ tri thức trừu tượng (như mẫu thiết kế và bài học sửa lỗi đã được mã hóa) giữa các không gian làm việc mà không làm rò rỉ mã nguồn dự án thô."
          }
        }
      ]
    }

    <!-- Lenis Smooth Scroll (Inertial Smooth Scrolling) -->
    <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.36/dist/lenis.min.js"></script>
    <script>
      const lenis = new Lenis({
        duration: 1.2,
        easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
        orientation: 'vertical',
        gestureOrientation: 'vertical',
        smoothWheel: true,
        wheelMultiplier: 1,
        smoothTouch: false
      });

      function raf(time) {
        lenis.raf(time);
        requestAnimationFrame(raf);
      }

      requestAnimationFrame(raf);
    </script>
