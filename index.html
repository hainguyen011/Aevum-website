<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aevum OS — Standalone MCP Server & Context Engine</title>
    <meta name="description" content="Aevum OS provides standalone Model Context Protocol server capabilities and desktop control center." />
    <!-- Google Fonts: Inter (Neo-Grotesque Display), Plus Jakarta Sans, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              dark: '#0B0B11',
              card: 'rgba(255, 255, 255, 0.02)',
              electron: {
                400: '#38bdf8',
                500: '#00d2ff',
                600: '#00b4d8',
                glow: '#00f0ff',
              }
            },
            fontFamily: {
              sans: ['Inter', '"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
              display: ['Inter', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            letterSpacing: {
              tighter: '-0.04em',
              tight: '-0.025em',
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-[#0B0B11] text-slate-100 antialiased selection:bg-cyan-500 selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
